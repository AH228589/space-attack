<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Space Attack</title>
    <meta name="description" content="A retro browser arcade shooter. Hold the line against diving alien waves that get faster every round." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div class="app">
      <main class="screen">
        <canvas id="game" aria-label="Space Attack game screen. Arrow keys or A and D to move, Space or click to fire, Enter to start, P to pause, M to mute."></canvas>
      </main>

      <!-- On-screen controls, shown on touch devices only. -->
      <div class="pad pad-util" aria-label="Game options">
        <div class="btn btn-small" role="button" aria-label="Pause" data-action="pause">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" /><rect x="14" y="5" width="4" height="14" /></svg>
        </div>
        <div class="btn btn-small" role="button" aria-label="Sound on or off" data-action="mute" id="mute-btn">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9h4l5-4v14l-5-4H4z" />
            <path class="sound-on" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke-width="2" />
            <path class="sound-off" d="M16 9l6 6M22 9l-6 6" fill="none" stroke-width="2" />
          </svg>
        </div>
      </div>
      <div class="pad pad-move" aria-label="Move">
        <div class="btn" role="button" aria-label="Move left" data-action="left">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 4 6 12l10 8z" /></svg>
        </div>
        <div class="btn" role="button" aria-label="Move right" data-action="right">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4l10 8-10 8z" /></svg>
        </div>
      </div>
      <div class="pad pad-fire" aria-label="Fire">
        <div class="btn btn-fire" role="button" aria-label="Fire" data-action="fire">FIRE</div>
      </div>
    </div>
    <noscript>Space Attack needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
